name: M V6 In-Browser 3D Smoke
on:
  push:
    paths:
      - 'm-world-3d.mjs'
      - 'm-world-browser-smoke.mjs'
      - 'scroll-buddy.js'
      - 'm-world.css'
      - 'index.html'
      - 'assets/m-v6-web/**'\n      - 'assets/m-v6-detail/**'\n      - 'm-world-spatial.mjs'
      - '.github/workflows/m-world-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-3d-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.23.0
      - name: Start website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/m-world-http.log 2>&1 &
          sleep 2
      - name: Render actual V6 mascot in Chrome
        run: node m-world-browser-smoke.mjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m-v6-chrome-smoke
          path: /tmp/m-world-smoke/
          if-no-files-found: ignore
